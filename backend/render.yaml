services:
  - type: web
    name: naviqr-backend
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: DATABASE_PATH
        value: /var/data/database.db
    disk:
      name: naviqr-data
      mountPath: /var/data
      sizeGB: 1